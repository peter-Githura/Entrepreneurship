<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rider Equipment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141414; --header-grad: linear-gradient(135deg,#1a1a1a 0%,#232016 100%);
    --border: #2a2a2a; --card: #1a1a1a; --input-bg: #1e1e1e; --input-border: #333;
    --text: #ffffff; --text-muted: #8a8a8a; --text-dim: #5a5a5a;
    --table-head: #1a1a1a; --table-row-border: #232323; --table-text: #e5e5e5;
    --accent: #F2CC38; --accent-text: #141414; --green: #00A082; --danger: #E85D3F;
    --danger-bg: #3a1414; --green-bg: #0f2e28;
  }
  [data-theme="light"] {
    --bg: #FAF8F2; --header-grad: linear-gradient(135deg,#FFFFFF 0%,#FFF6D9 100%);
    --border: #e6e1d3; --card: #FFFFFF; --input-bg: #FFFFFF; --input-border: #d8d2c0;
    --text: #232016; --text-muted: #75705f; --text-dim: #a39d8a;
    --table-head: #F4F0E2; --table-row-border: #ece7d8; --table-text: #2c2818;
    --accent: #F2CC38; --accent-text: #232016; --green: #00A082; --danger: #C8492F;
    --danger-bg: #FBE7E1; --green-bg: #E3F4EF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text); padding: 0; min-height: 100vh;
  }
  #app-shell {
    display: flex; width: 100%; min-height: 100vh; background: var(--bg); color: var(--text);
  }
  #sidebar {
    width: 230px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 18px 0; transition: width .15s ease;
  }
  #sidebar.collapsed { width: 68px; }
  #sidebar.collapsed .sidebar-link { justify-content:center; padding:10px 8px; }
  .sidebar-toggle {
    margin: 0 14px 14px 14px; background:transparent; border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--text-muted); font-family:inherit;
  }
  #sidebar.collapsed .sidebar-toggle { margin: 0 auto 14px auto; padding:6px 10px; }
  .sidebar-logo { display:flex; align-items:center; gap:10px; padding: 0 18px 20px 18px; }
  .logo { width:34px; height:34px; border-radius:9px; background:#F2CC38; display:flex; align-items:center; justify-content:center; font-weight:900; color:#141414; font-size:16px; flex-shrink:0; }
  .sidebar-logo .t1 { font-weight:800; font-size:15px; letter-spacing:-0.01em; line-height:1.2; }
  .sidebar-logo .t2 { font-size:10.5px; color: var(--text-muted); line-height:1.3; }
  .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:2px; padding: 0 10px; overflow-y:auto; }
  .sidebar-link {
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    color: var(--text-muted); font-weight:600; font-size:13.5px; cursor:pointer; border:none;
    background:transparent; text-align:left; width:100%; font-family:inherit;
  }
  .sidebar-link .ic { font-size:15px; width:18px; text-align:center; flex-shrink:0; }
  .sidebar-link.active { background: var(--accent); color: var(--accent-text); font-weight:800; }
  .sidebar-online { padding: 14px 18px 0 18px; border-top: 1px solid var(--border); margin-top: 10px; }
  .online-label { font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  .avatar { width:22px; height:22px; border-radius:50%; border:2px solid var(--card); display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; color:#fff; margin-left:-7px; }
  .avatar:first-child { margin-left:0; }
  #main-area { flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar {
    background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  #topbar .page-title { font-weight:800; font-size:17px; letter-spacing:-0.01em; }
  #topbar .page-sub { font-size:12px; color: var(--text-muted); margin-top:2px; }
  .toggle-btn { display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border); color:var(--text); border-radius:20px; padding:7px 12px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0; }
  .content { padding: 24px; display:flex; flex-direction:column; gap:20px; max-width: 1100px; }
  @media (max-width: 760px) {
    #app-shell { flex-direction: column; }
    #sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; align-items:center; }
    .sidebar-logo { padding: 0 12px 0 4px; }
    .sidebar-nav { flex-direction: row; overflow-x: auto; }
    .sidebar-online { display:none; }
  }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
  input, select, textarea {
    background: var(--input-bg); border:1px solid var(--input-border); border-radius:8px; padding:10px 12px;
    color: var(--text); font-family:inherit; font-size:14px; outline:none; width:100%;
  }
  input[type=color] { padding:4px; height:40px; cursor:pointer; }
  textarea { resize:vertical; font-family: monospace; }
  .btn { border:none; border-radius:8px; padding:10px 16px; font-weight:800; font-size:13px; font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .btn-accent { background: var(--accent); color: var(--accent-text); }
  .btn-green { background: var(--green); color:#fff; }
  .btn-danger { background: var(--danger); color:#fff; }
  .btn-outline { background:transparent; border:1px solid var(--input-border); color:var(--text); }
  .card { background: var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .grid-auto { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .grid-auto-140 { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:9px 12px; background:var(--table-head); color:var(--text-muted); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-bottom:1px solid var(--border); }
  td { padding:9px 12px; border-bottom:1px solid var(--table-row-border); color:var(--table-text); }
  .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:10px; }
  .muted { color: var(--text-muted); }
  .dim { color: var(--text-dim); }
  .accent-text { color: var(--accent); font-weight:700; }
  .green-text { color: var(--green); font-weight:700; }
  .danger-text { color: var(--danger); font-weight:700; }
  .item-card { cursor:pointer; border:2px solid var(--border); background:var(--card); border-radius:12px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
  .item-card.active { }
  .item-card img, .item-badge { width:100%; height:64px; object-fit:cover; border-radius:8px; }
  .item-badge { display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; color:#fff; }
  .size-btn, .toggle-choice { border-radius:8px; padding:10px 8px; font-weight:800; font-size:13px; font-family:inherit; cursor:pointer; text-align:center; border:1px solid var(--input-border); background:transparent; color:var(--text); }
  .size-btn.active { color:#fff; }
  .toast { position:fixed; bottom:20px; right:20px; padding:12px 16px; border-radius:10px; display:flex; align-items:center; gap:10px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:999; max-width:360px; color:#fff; }
  .toast.success { background:#0f2e28; border:1px solid var(--green); }
  .toast.error { background:#3a1414; border:1px solid var(--danger); }
  .rider-dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--input-bg); border:1px solid var(--input-border); border-radius:8px; overflow:hidden; z-index:20; max-height:220px; overflow-y:auto; }
  .rider-dropdown-item { padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--border); font-size:13.5px; }
  .relative { position:relative; }
  .setup-banner { background:#3a1414; border:1px solid var(--danger); color:#fff; padding:14px; border-radius:10px; font-size:13px; line-height:1.6; }
  .setup-banner code { background:rgba(255,255,255,.12); padding:2px 6px; border-radius:4px; }
  ::placeholder { color: var(--text-dim); }
  #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background: var(--bg); padding:20px; }
  .login-card { width:100%; max-width:360px; background: var(--card); border:1px solid var(--border); border-radius:16px; padding:32px 28px; }
  .login-logo { width:44px; height:44px; border-radius:12px; background:#F2CC38; display:flex; align-items:center; justify-content:center; font-weight:900; color:#141414; font-size:20px; margin:0 auto 16px auto; }
  .login-title { text-align:center; font-weight:800; font-size:17px; margin-bottom:4px; }
  .login-sub { text-align:center; font-size:12.5px; color:var(--text-muted); margin-bottom:22px; }
  .login-error { background: var(--danger-bg); border:1px solid var(--danger); color:var(--text); border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; display:none; }
  .login-error.show { display:block; }
</style>
</head>
<body>
<div id="login-screen"></div>
<div id="app-shell" style="display:none;">
  <div id="sidebar"></div>
  <div id="main-area">
    <div id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="toast-container"></div>

<script>
/* =========================================================
   CONFIG — paste your deployed Apps Script Web App URL below
========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxsrdQ55s2ERN5DWPOSK5z4gB8NBLAS5jJguPYGdzVLvRdO2aZjnwt0XEc9pUXK4FC4_Q/exec";
const POLL_MS = 12000;
const HEARTBEAT_MS = 20000;
const ONLINE_THRESHOLD_MS = 45000;

/* =========================================================
   GLOVO RIDER EQUIPMENT TRACKER — standalone frontend
   Talks to a Google Apps Script Web App (see Code.gs) which
   reads/writes a Google Sheet. No build step — open index.html
   directly or host as a static site (e.g. GitHub Pages).
========================================================= */

/* ---------------- constants ---------------- */
const REPLACEMENT_REASONS = ["Damaged Bag", "Dirty Bag", "Stolen", "Competitor"];
const COMPETITORS = ["Uber Eats", "Bolt Food", "Jumia", "Little", "eBee", "Dial Delivery", "Other"];
const GLOVO_EMAIL_RE = /^[^\s@]+@([a-zA-Z0-9-]+\.)*glovoapp\.com$/i;
const AVATAR_COLORS = ["#F2CC38", "#00A082", "#E85D3F", "#7A6A1E", "#3F7CE8", "#B14FD8", "#D8574F", "#3FAE8C"];
const TABS = [
  { id: "issue", label: "Issue Item", icon: "📋" },
  { id: "reports", label: "Reports", icon: "📊" },
  { id: "stock", label: "Stock", icon: "📦" },
  { id: "items", label: "Items", icon: "🏷️" },
  { id: "centres", label: "Glover Centres", icon: "🏢" },
  { id: "riders", label: "Riders", icon: "👥" },
  { id: "wallet", label: "Rider Wallet", icon: "👛" },
  { id: "team", label: "Team", icon: "✅" },
  { id: "log", label: "Issuance Log", icon: "📅" },
];
const NON_ADMIN_TABS = ["issue", "reports"];
function visibleTabs() {
  return currentUser && currentUser.isAdmin ? TABS : TABS.filter((t) => NON_ADMIN_TABS.includes(t.id));
}

/* ---------------- helpers ---------------- */
function isoWeekLabel(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  const week = 1 + Math.round(diff / (7 * 86400000));
  return `${target.getFullYear()}-W${String(week).padStart(2, "0")}`;
}
function weekdayName(dateStr) {
  if (!dateStr) return "";
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-GB", { weekday: "long" });
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function stockKey(sku, size) { return size ? `${sku}::${size}` : sku; }
function expandStockRows(items) {
  return items.flatMap((it) => {
    if (it.sizes && it.sizes.length > 0) {
      return it.sizes.map((size) => ({ ...it, size, key: stockKey(it.sku, size), label: `${it.name} (${size})` }));
    }
    return [{ ...it, size: null, key: stockKey(it.sku, null), label: it.name }];
  });
}
function formatKES(n) {
  n = Number(n) || 0;
  const sign = n < 0 ? "-" : "";
  return `${sign}KES ${Math.abs(n).toLocaleString()}`;
}
function isBagItem(item) {
  if (!item) return false;
  const s = `${item.name} ${item.sku}`.toLowerCase();
  return s.includes("bag") || s.includes("backpack");
}
function avatarColorFor(email) {
  let hash = 0;
  for (let i = 0; i < email.length; i++) hash = (hash * 31 + email.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function allWalletBalances(ledger) {
  const map = {};
  ledger.forEach((l) => {
    const delta = l.type === "charge" ? Number(l.amount) : -Number(l.amount);
    map[l.riderId] = (map[l.riderId] || 0) + delta;
  });
  return map;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// For values interpolated INSIDE a single-quoted JS string literal within an
// inline onclick="...('...')" attribute. HTML-escaping alone (esc) is not
// enough there since the browser decodes HTML entities before running the
// JS, so an apostrophe in a name (e.g. "O'Riri") would otherwise break out
// of the string and throw a syntax error. This escapes for JS first, then
// still HTML-escapes double quotes so it's safe inside the attribute too.
function jsEsc(s) {
  return esc(String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
}
function daysAgo(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

/* ---------------- state ---------------- */
let STATE = { riders: [], centres: [], items: [], stockWarehouse: {}, stockCentres: {}, issuances: [], walletLedger: [], staff: [] };
let currentTab = "issue";
let staffProfile = JSON.parse(localStorage.getItem("staffProfile") || "null");
let editingStaffProfile = !staffProfile;
let darkMode = localStorage.getItem("darkMode") !== "false";
let sidebarCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
let currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
let loginError = "";
let toastTimer = null;

let issueDraft = {
  date: todayStr(), riderQuery: "", selectedRider: null, itemSku: "", size: "",
  qty: 1, centre: "", amount: "", paymentMethod: "paid", transactionCode: "",
  replacementReason: "", competitorName: "",
};
let itemsDraft = { sku: "", name: "", spec: "", color: "#00A082", imageUrl: "", sizesInput: "" };
let centresDraft = { newName: "", newPoc: "" };
let ridersDraft = { bulk: "", search: "", singleId: "", singleName: "" };
let walletDraft = { search: "", settlingId: null, settleAmount: "", settleCode: "" };
let teamDraft = { search: "" };
let logDraft = { weekFilter: "all", centreFilter: "all" };
let staffFormDraft = { name: staffProfile?.name || "", email: staffProfile?.email || "" };

/* ---------------- API ---------------- */
async function apiCall(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Request failed");
  return json.data;
}


/* ---------------- embedded built-in item photos ---------------- */

function applyBuiltinImages(items) {
  return items.map((it) =>
    BUILTIN_IMAGES[it.sku] ? { ...it, image: BUILTIN_IMAGES[it.sku] } : it
  );
}

/* ---------------- embedded built-in item sizes ---------------- */
/* Same idea as photos above — baked in so Rain Jacket and Reflective
   Vest Coat always offer S,M,L,XL,2XL,3XL when issuing, no matter what
   the Sheet's "sizes" column says. */
const BUILTIN_SIZES = {
  "GLOVORAINJKT5C": ["S", "M", "L", "XL", "2XL", "3XL"],
  "GLOVOVEST7E": ["S", "M", "L", "XL", "2XL", "3XL"],
};
function applyBuiltinSizes(items) {
  return items.map((it) =>
    BUILTIN_SIZES[it.sku] ? { ...it, sizes: BUILTIN_SIZES[it.sku] } : it
  );
}

// Google Sheets auto-detects numeric-looking cells (e.g. a rider ID like
// "4484610") and silently stores them as Numbers, not text. Every value
// that should behave as text — for search, comparisons, and display —
// gets coerced back to a string here, once, right when data comes in.
// Without this, things like rider search and selecting a rider by ID
// silently break for any numeric-looking ID or name.
function normalizeState(state) {
  const str = (v) => (v == null ? "" : String(v));
  state.riders = (state.riders || []).map((r) => ({ ...r, id: str(r.id), name: str(r.name) }));
  state.centres = (state.centres || []).map((c) => ({ ...c, name: str(c.name), poc: str(c.poc) }));
  state.items = (state.items || []).map((it) => ({ ...it, sku: str(it.sku), name: str(it.name) }));
  state.staff = (state.staff || []).map((p) => ({ ...p, email: str(p.email), name: str(p.name) }));
  state.issuances = (state.issuances || []).map((i) => ({ ...i, riderId: str(i.riderId), riderName: str(i.riderName), sku: str(i.sku) }));
  state.walletLedger = (state.walletLedger || []).map((l) => ({ ...l, riderId: str(l.riderId), riderName: str(l.riderName) }));
  const newStockWarehouse = {};
  Object.keys(state.stockWarehouse || {}).forEach((k) => (newStockWarehouse[str(k)] = state.stockWarehouse[k]));
  state.stockWarehouse = newStockWarehouse;
  const newStockCentres = {};
  Object.keys(state.stockCentres || {}).forEach((centre) => {
    const row = {};
    Object.keys(state.stockCentres[centre] || {}).forEach((k) => (row[str(k)] = state.stockCentres[centre][k]));
    newStockCentres[str(centre)] = row;
  });
  state.stockCentres = newStockCentres;
  return state;
}

async function refreshData() {
  try {
    STATE = normalizeState(await apiCall("getAll", {}));
    STATE.items = applyBuiltinImages(STATE.items);
    STATE.items = applyBuiltinSizes(STATE.items);
  } catch (e) {
    console.error(e);
  }
}

function isTypingInField() {
  const a = document.activeElement;
  return a && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName) && document.getElementById("content").contains(a);
}

/* ---------------- toast ---------------- */
function showToast(msg, type) {
  const c = document.getElementById("toast-container");
  clearTimeout(toastTimer);
  c.innerHTML = `<div class="toast ${type === "error" ? "error" : "success"}">${esc(msg)}</div>`;
  toastTimer = setTimeout(() => (c.innerHTML = ""), 3800);
}

/* ---------------- bootstrap ---------------- */
async function initDashboard() {
  document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
    document.getElementById("content").innerHTML = `
      <div class="setup-banner">
        <strong>Setup needed:</strong> open <code>index.html</code> and set <code>APPS_SCRIPT_URL</code>
        at the top to your deployed Google Apps Script Web App URL. See SETUP_INSTRUCTIONS.md for the
        full walkthrough (create the Sheet, paste Code.gs, deploy, copy the URL here).
      </div>`;
    return;
  }
  await refreshData();
  if (!issueDraft.itemSku && STATE.items.length) issueDraft.itemSku = STATE.items[0].sku;
  if (!issueDraft.centre && STATE.centres.length) issueDraft.centre = STATE.centres[0].name;
  if (!currentUser.isAdmin && !["issue", "reports"].includes(currentTab)) currentTab = "issue";
  render();
  setInterval(async () => {
    await refreshData();
    if (!isTypingInField()) render();
  }, POLL_MS);
  setInterval(heartbeat, HEARTBEAT_MS);
  heartbeat();
}

async function heartbeat() {
  if (!staffProfile) return;
  try {
    await apiCall("upsertStaff", { email: staffProfile.email, name: staffProfile.name });
  } catch (e) { /* ignore */ }
}

/* ---------------- login gate ---------------- */
function renderLoginScreen() {
  document.getElementById("app-shell").style.display = "none";
  document.getElementById("login-screen").innerHTML = `
    <div class="login-card">
      <div class="login-logo">G</div>
      <div class="login-title">Rider Equipment Tracker</div>
      <div class="login-sub">Sign in to continue</div>
      <div class="login-error ${loginError ? "show" : ""}">${esc(loginError)}</div>
      <div class="field" style="margin-bottom:14px;">
        <label>Username</label>

      </div>

        <label>Password</label>
        <input id="loginPassword" type="password" onkeydown="if(event.key==='Enter') attemptLogin();" placeholder="Your password" />
      </div>
      <button class="btn btn-accent" style="width:100%;padding:12px;" onclick="attemptLogin()">Sign In</button>
    </div>`;
}

async function attemptLogin() {
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  if (!username || !password) {
    loginError = "Enter both username and password.";
    renderLoginScreen();
    return;
  }
  try {
    const data = await apiCall("login", { username, password });
    currentUser = data;
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
    loginError = "";
    document.getElementById("login-screen").innerHTML = "";
    document.getElementById("app-shell").style.display = "flex";
    await initDashboard();
  } catch (e) {
    loginError = e.message || "Incorrect username or password.";
    renderLoginScreen();
  }
}
window.attemptLogin = attemptLogin;

function logout() {
  currentUser = null;
  localStorage.removeItem("currentUser");
  document.getElementById("app-shell").style.display = "none";
  renderLoginScreen();
}
window.logout = logout;

function currentIssueItem() { return STATE.items.find((i) => i.sku === issueDraft.itemSku); }
function currentHasSizes() { const it = currentIssueItem(); return it && it.sizes && it.sizes.length > 0; }
function currentStockKey() { return stockKey(issueDraft.itemSku, currentHasSizes() ? issueDraft.size : null); }
function centreQty(centre, key) { return (STATE.stockCentres[centre] && STATE.stockCentres[centre][key]) || 0; }

  const balances = allWalletBalances(STATE.walletLedger);

      </div>
    </div>` : "";

  const bagSection = bagSelected ? `
    <div class="card">
      <div style="font-weight:800;font-size:15px;margin-bottom:10px;">⚠ Reason for Replacement</div>
      <div class="grid-auto" style="margin-bottom:10px;">
        ${REPLACEMENT_REASONS.map((r) => `<button class="toggle-choice ${issueDraft.replacementReason === r ? "active" : ""}" style="${issueDraft.replacementReason === r ? "background:var(--accent);color:var(--accent-text);border-color:var(--accent);" : ""}" onclick="selectReason('${r}')">${r}</button>`).join("")}
      </div>
      ${issueDraft.replacementReason === "Competitor" ? `
        <div class="field"><label>Which competitor?</label>
          <select onchange="issueDraft.competitorName=this.value">

            ${COMPETITORS.map((c) => `<option value="${esc(c)}" ${issueDraft.competitorName === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
          </select>
        </div>` : ""}
    </div>` : "";

  const paymentAmountField = issueDraft.paymentMethod !== "free" ? `
    <div class="field"><label>Amount (KES)</label>
      <input type="number" min="0" value="${esc(issueDraft.amount)}" oninput="issueDraft.amount=this.value" placeholder="0" />
    </div>` : "";
  const paymentExtra = issueDraft.paymentMethod === "paid"
    ? `<div class="field"><label>Transaction Code (M-Pesa / payment ref)</label><input style="text-transform:uppercase;" value="${esc(issueDraft.transactionCode)}" oninput="issueDraft.transactionCode=this.value" placeholder="e.g. QFT7X8YZ12" /></div>`
    : issueDraft.paymentMethod === "wallet"
    ? `<div class="muted" style="font-size:12px;">No transaction code needed — this amount will be added to the rider's wallet as unpaid, visible in the Rider Wallet tab until they settle it.</div>`

      </div>
      <div class="field"><label>Glover Centre</label>
        <select onchange="issueDraft.centre=this.value; setTab('issue')">
          ${STATE.centres.map((c) => `<option value="${esc(c.name)}" ${issueDraft.centre === c.name ? "selected" : ""}>${esc(c.name)}${c.poc ? " — " + esc(c.poc) : ""}</option>`).join("")}

      </div>

    <div class="field relative">

    ${sizePicker}

    <div class="grid-2">
      <div class="field"><label>Quantity</label>
        <input type="number" min="1" value="${issueDraft.qty}" oninput="issueDraft.qty=parseInt(this.value||'1',10)" />

      <div class="field" style="margin-bottom:12px;"><label>Payment Status</label>
        <div style="display:flex;gap:8px;">

  const input = document.getElementById("riderSearchInput");

function selectIssueItem(sku) {
  issueDraft.itemSku = sku;
  const it = STATE.items.find((i) => i.sku === sku);
  issueDraft.size = it && it.sizes && it.sizes.length ? it.sizes[0] : "";
  if (!isBagItem(it)) { issueDraft.replacementReason = ""; issueDraft.competitorName = ""; }

}
window.selectIssueItem = selectIssueItem;
function selectIssueSize(sz) { issueDraft.size = sz; render(); }
window.selectIssueSize = selectIssueSize;
function selectReason(r) { issueDraft.replacementReason = r; if (r !== "Competitor") issueDraft.competitorName = ""; render(); }
window.selectReason = selectReason;
function selectPayment(m) { issueDraft.paymentMethod = m; if (m === "free") { issueDraft.amount = ""; issueDraft.transactionCode = ""; } render(); }
window.selectPayment = selectPayment;

function onRiderQueryInput(val) {
  issueDraft.selectedRider = null;
  issueDraft.riderQuery = val;
  const q = val.toLowerCase().trim();
  const dd = document.getElementById("riderDropdown");
  if (!q) { dd.innerHTML = ""; return; }
  const matches = STATE.riders.filter((r) => r.id.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { dd.innerHTML = `<div class="dim" style="font-size:12px;margin-top:6px;">No rider matches "${esc(val)}". Add riders in the Riders tab.</div>`; return; }
  dd.innerHTML = `<div class="rider-dropdown">${matches.map((r) => `<div class="rider-dropdown-item" onmousedown="event.preventDefault(); selectRider('${jsEsc(r.id)}')"><span class="accent-text">${esc(r.id)}</span> <span>${esc(r.name)}</span></div>`).join("")}</div>`;
}
window.onRiderQueryInput = onRiderQueryInput;
function selectRider(id) {
  const r = STATE.riders.find((x) => x.id === id);
  if (!r) return;
  issueDraft.selectedRider = r;
  issueDraft.riderQuery = "";
  render();
}
window.selectRider = selectRider;

async function submitIssuance() {
  if (!staffProfile) return showToast("Set who you are (name + glovoapp.com email) before recording an issuance.", "error");
  if (!issueDraft.selectedRider) return showToast("Search and select a rider ID first.", "error");
  const it = currentIssueItem();
  const hasSizes = currentHasSizes();
  if (hasSizes && !issueDraft.size) return showToast(`Select a size for the ${it.name}.`, "error");
  if (!issueDraft.centre) return showToast("Select a Glover Centre.", "error");
  if (issueDraft.qty < 1) return showToast("Quantity must be at least 1.", "error");
  const bagSelected = isBagItem(it);
  if (bagSelected && !issueDraft.replacementReason) return showToast("Select a reason for replacing the bag.", "error");
  if (bagSelected && issueDraft.replacementReason === "Competitor" && !issueDraft.competitorName) return showToast("Select which competitor the rider is moving to.", "error");

  const numAmount = issueDraft.paymentMethod === "free" ? 0 : parseFloat(issueDraft.amount || "0");
  if (issueDraft.paymentMethod !== "free" && issueDraft.amount !== "" && (isNaN(numAmount) || numAmount < 0)) return showToast("Enter a valid amount.", "error");
  if (issueDraft.paymentMethod === "paid" && numAmount > 0 && !issueDraft.transactionCode.trim()) return showToast("Enter the M-Pesa / payment transaction code.", "error");

  const week = isoWeekLabel(issueDraft.date);
  const weekday = weekdayName(issueDraft.date);
  const payload = {
    id: uid(), date: issueDraft.date, week, weekday,
    riderId: issueDraft.selectedRider.id, riderName: issueDraft.selectedRider.name,
    sku: issueDraft.itemSku, itemName: it.name, size: hasSizes ? issueDraft.size : "",
    centre: issueDraft.centre, qty: issueDraft.qty,
    issuedByName: staffProfile.name, issuedByEmail: staffProfile.email,
    amount: numAmount, paymentMethod: issueDraft.paymentMethod === "free" ? "free" : (numAmount > 0 ? issueDraft.paymentMethod : "n/a"),
    transactionCode: issueDraft.paymentMethod === "paid" ? issueDraft.transactionCode.trim() : "",
    replacementReason: bagSelected ? issueDraft.replacementReason : "",
    competitorName: bagSelected && issueDraft.replacementReason === "Competitor" ? issueDraft.competitorName : "",
  };

  try {
    await apiCall("recordIssuance", payload);
    await apiCall("upsertStaff", { email: staffProfile.email, name: staffProfile.name });
    const paymentNote = payload.paymentMethod === "free" ? " Issued free of charge."
      : numAmount > 0 ? (payload.paymentMethod === "wallet" ? ` ${formatKES(numAmount)} added to rider wallet (unpaid).` : ` ${formatKES(numAmount)} paid, txn ${payload.transactionCode}.`) : "";
    const reasonNote = bagSelected ? ` Reason: ${payload.replacementReason}${payload.replacementReason === "Competitor" ? ` (${payload.competitorName})` : ""}.` : "";
    showToast(`Recorded: ${payload.qty} × ${it.name}${payload.size ? ` (${payload.size})` : ""} issued to ${payload.riderId} (${payload.riderName}) at ${payload.centre}.${paymentNote}${reasonNote}`);
    issueDraft.riderQuery = ""; issueDraft.selectedRider = null; issueDraft.qty = 1;
    issueDraft.amount = ""; issueDraft.transactionCode = ""; issueDraft.paymentMethod = "paid";
    issueDraft.replacementReason = ""; issueDraft.competitorName = "";
    await refreshData();
    render();
  } catch (e) {
    showToast(e.message, "error");
  }
}
window.submitIssuance = submitIssuance;

function renderTabContent() {

    case "centres": el.innerHTML = renderCentresTab(); break;
    case "riders": el.innerHTML = renderRidersTab(); break;

/* ---------------- REPORTS TAB ---------------- */
function renderReportsTab() {
  const rows = expandStockRows(STATE.items);
  const centreNames = STATE.centres.map((c) => c.name);

  function issuedQtyFor(centre, key) {
    return STATE.issuances
      .filter((i) => i.centre === centre && stockKey(i.sku, i.size || null) === key)
      .reduce((s, i) => s + (Number(i.qty) || 0), 0);
  }

  const summary = centreNames.map((centre) => {
    const stockRow = STATE.stockCentres[centre] || {};
    const stockTotal = Object.values(stockRow).reduce((s, v) => s + (Number(v) || 0), 0);
    const issuedTotal = STATE.issuances.filter((i) => i.centre === centre).reduce((s, i) => s + (Number(i.qty) || 0), 0);
    return { centre, stockTotal, issuedTotal };
  });

  const grandStock = summary.reduce((s, r) => s + r.stockTotal, 0);
  const grandIssued = summary.reduce((s, r) => s + r.issuedTotal, 0);

  const summaryRows = summary.length ? summary.map((r) => `
    <tr>
      <td style="font-weight:700;">${esc(r.centre)}</td>
      <td>${r.stockTotal}</td>
      <td class="accent-text">${r.issuedTotal}</td>
    </tr>`).join("") : `<tr><td colspan="3">No Glover Centres yet.</td></tr>`;

  const detailRows = [];
  centreNames.forEach((centre) => {
    rows.forEach((r) => {
      const stockQty = (STATE.stockCentres[centre] || {})[r.key] || 0;
      const issuedQty = issuedQtyFor(centre, r.key);
      if (stockQty > 0 || issuedQty > 0) detailRows.push({ centre, label: r.label, stockQty, issuedQty });
    });
  });
  const detailHtml = detailRows.length ? detailRows.map((d) => `
    <tr>
      <td>${esc(d.centre)}</td>
      <td>${esc(d.label)}</td>
      <td>${d.stockQty}</td>
      <td class="accent-text">${d.issuedQty}</td>

// Minimal CSV line parser — handles quoted fields containing commas.
function parseCsvLine(line) {
  const cells = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { cur += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { cells.push(cur); cur = ""; }
      else cur += c;
    }
  }
  cells.push(cur);
  return cells.map((c) => c.trim());
}

function handleCsvUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return showToast("That CSV file looks empty.", "error");

    const rows = lines.map(parseCsvLine);

    // Detect an ID column and a Name column by header, case-insensitively.
    // Falls back to "first column = id, second column = name" if no
    // recognizable header is found.
    const header = rows[0].map((h) => h.toLowerCase());
    const idCandidates = ["rider_id", "riderid", "id"];
    const nameCandidates = ["full_name", "fullname", "name", "rider_name", "ridername"];
    let idIdx = header.findIndex((h) => idCandidates.includes(h));
    let nameIdx = header.findIndex((h) => nameCandidates.includes(h));
    let dataRows = rows;
    if (idIdx !== -1 && nameIdx !== -1) {
      dataRows = rows.slice(1); // skip header row
    } else {
      idIdx = 0; nameIdx = 1; // no recognizable header — assume col A, col B
    }

    const parsed = [];
    dataRows.forEach((r) => {
      const id = (r[idIdx] || "").trim();
      const name = (r[nameIdx] || "").trim();
      if (id && name) parsed.push({ id, name });
    });

    if (!parsed.length) {
      showToast('Could not find rider ID / name columns in that CSV.', "error");
      return;
    }
    await performRiderImport(parsed);
  };
  reader.onerror = () => showToast("Couldn't read that file.", "error");
  reader.readAsText(file);
  event.target.value = ""; // allow re-selecting the same file later
}
window.handleCsvUpload = handleCsvUpload;

      <td>${formatKES(l.amount)}</td>
      <td>${esc(l.note || l.transactionCode || "—")}</td>
    </tr>`).join("") : `<tr><td colspan="5">No wallet activity yet.</td></tr>`;

  return `
    <div style="font-weight:800;font-size:15px;">👛 Rider Wallet</div>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;">
      <div class="muted" style="font-size:12.5px;">Total outstanding across all riders</div>
      <div style="font-size:20px;font-weight:800;color:var(--danger);">${formatKES(totalOwed)}</div>
    </div>
    <div class="field"><label>Search riders</label><input value="${esc(walletDraft.search)}" oninput="walletDraft.search=this.value; filterWalletRows()" placeholder="Search by ID or name…" /></div>
    <div class="table-wrap"><table><thead><tr><th>Rider ID</th><th>Name</th><th>Balance</th><th></th></tr></thead><tbody id="walletRowsBody">${walletRowsHtml()}</tbody></table></div>
    <div>
      <div style="font-weight:800;font-size:15px;margin-bottom:8px;">🧾 Wallet Ledger</div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Rider</th><th>Type</th><th>Amount</th><th>Note / Txn Code</th></tr></thead><tbody>${ledgerHtml}</tbody></table></div>
    </div>
  `;
}
function toggleSettle(id) { walletDraft.settlingId = walletDraft.settlingId === id ? null : id; walletDraft.settleAmount = ""; walletDraft.settleCode = ""; render(); }
window.toggleSettle = toggleSettle;
async function confirmSettle(riderId, riderName) {
  const amt = parseFloat(walletDraft.settleAmount || "0");
  if (isNaN(amt) || amt <= 0) return showToast("Enter a valid settlement amount.", "error");
  if (!walletDraft.settleCode.trim()) return showToast("Enter the M-Pesa / payment transaction code.", "error");
  try {
    await apiCall("addWalletSettlement", { riderId, riderName, amount: amt, transactionCode: walletDraft.settleCode.trim() });
    showToast(`Recorded ${formatKES(amt)} settlement from ${riderId}.`);
    walletDraft.settlingId = null; walletDraft.settleAmount = ""; walletDraft.settleCode = "";
    await refreshData(); render();
  } catch (e) { showToast(e.message, "error"); }
}
window.confirmSettle = confirmSettle;

/* ---------------- TEAM TAB ---------------- */
function teamRowsHtml() {
  const rows = [...STATE.staff]
    .filter((p) => p.email.toLowerCase().includes(teamDraft.search.toLowerCase()) || p.name.toLowerCase().includes(teamDraft.search.toLowerCase()))
    .sort((a, b) => (a.lastActive < b.lastActive ? 1 : -1));

  return rows.length ? rows.map((p) => {
    const d = daysAgo(p.lastActive);
    const isMe = staffProfile && staffProfile.email === p.email;
    return `<tr>
      <td style="font-weight:700;">${esc(p.name)}${isMe ? ` <span class="accent-text">(you)</span>` : ""}</td>
      <td>${esc(p.email)}</td>
      <td>${p.firstSeen ? new Date(p.firstSeen).toLocaleDateString("en-GB") : "—"}</td>
      <td><span style="color:${d !== null && d <= 7 ? "var(--green)" : "var(--text-muted)"};font-weight:${d !== null && d <= 7 ? 700 : 400};">⏱ ${d === 0 ? "Today" : d === 1 ? "Yesterday" : d !== null ? d + " days ago" : "—"}</span></td>
      <td><span style="cursor:pointer;color:var(--danger);" onclick="removeStaff('${jsEsc(p.email)}')">🗑</span></td>
    </tr>`;
  }).join("") : `<tr><td colspan="5">No one has set up an "Issued by" identity yet.</td></tr>`;
}
function filterTeamRows() {
  const tbody = document.getElementById("teamRowsBody");
  if (tbody) tbody.innerHTML = teamRowsHtml();
}
window.filterTeamRows = filterTeamRows;

function renderTeamTab() {
  const activeLast7 = STATE.staff.filter((p) => { const d = daysAgo(p.lastActive); return d !== null && d <= 7; }).length;

  return `
    <div style="font-weight:800;font-size:15px;">✅ Team (${STATE.staff.length} live emails)</div>
    <div class="card muted" style="border-color:var(--accent);font-size:12.5px;">This list is shared across every device using this tracker — anyone with access can see who's set up an "Issued by" identity, and when they last recorded an issuance.</div>
    <div class="grid-2">
      <div class="card"><div class="muted" style="font-size:12px;">Total registered</div><div style="font-size:22px;font-weight:800;">${STATE.staff.length}</div></div>
      <div class="card"><div class="muted" style="font-size:12px;">Active in last 7 days</div><div style="font-size:22px;font-weight:800;color:var(--green);">${activeLast7}</div></div>
    </div>
    <div class="field"><label>Search team</label><input value="${esc(teamDraft.search)}" oninput="teamDraft.search=this.value; filterTeamRows()" placeholder="Search by name or email…" /></div>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>First seen</th><th>Last active</th><th></th></tr></thead><tbody id="teamRowsBody">${teamRowsHtml()}</tbody></table></div>
  `;
}
async function removeStaff(email) {
  try { await apiCall("removeStaff", { email }); showToast("Removed from the team directory."); await refreshData(); render(); }
  catch (e) { showToast(e.message, "error"); }
}
window.removeStaff = removeStaff;

/* ---------------- LOG TAB ---------------- */
function renderLogTab() {
  const weeks = Array.from(new Set(STATE.issuances.map((i) => i.week))).sort().reverse();
  const centreList = Array.from(new Set(STATE.issuances.map((i) => i.centre))).sort();
  const filtered = STATE.issuances.filter((i) =>
    (logDraft.weekFilter === "all" || i.week === logDraft.weekFilter) &&
    (logDraft.centreFilter === "all" || i.centre === logDraft.centreFilter)
  );

  const rowsHtml = filtered.length ? filtered.map((i) => `
    <tr>
      <td>${esc(i.date)}</td>
      <td>${esc(i.week)}</td>
      <td><span class="accent-text">${esc(i.riderId)}</span> ${esc(i.riderName)}</td>
      <td>${esc(i.itemName)}${i.size ? ` (${esc(i.size)})` : ""}</td>
      <td>${esc(i.centre)}</td>
      <td>${i.qty}</td>
      <td>${i.replacementReason ? `<span style="color:${i.replacementReason === "Competitor" ? "var(--danger)" : "var(--text-muted)"};font-weight:${i.replacementReason === "Competitor" ? 700 : 400};">${esc(i.replacementReason)}${i.competitorName ? ` (${esc(i.competitorName)})` : ""}</span>` : `<span class="dim">—</span>`}</td>
      <td>${i.paymentMethod === "free" ? `<span class="accent-text">🎁 Free</span>` : !i.amount ? `<span class="dim">—</span>` : i.paymentMethod === "wallet" ? `<span class="danger-text">${formatKES(i.amount)} · Wallet</span>` : `<span class="green-text">${formatKES(i.amount)} · ${esc(i.transactionCode)}</span>`}</td>
      <td>${i.issuedByName ? esc(i.issuedByName) : `<span class="dim">—</span>`}</td>
      <td><span style="cursor:pointer;color:var(--danger);" onclick="deleteIssuance('${jsEsc(i.id)}')">🗑</span></td>
    </tr>`).join("") : `<tr><td colspan="10">No issuance records yet.</td></tr>`;

  return `
    <div style="font-weight:800;font-size:15px;">📅 Issuance Log</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;">
      <div class="field"><label>Week</label><select style="min-width:140px;" onchange="logDraft.weekFilter=this.value; render()">
        <option value="all">All weeks</option>${weeks.map((w) => `<option value="${esc(w)}" ${logDraft.weekFilter === w ? "selected" : ""}>${esc(w)}</option>`).join("")}
      </select></div>
      <div class="field"><label>Centre</label><select style="min-width:160px;" onchange="logDraft.centreFilter=this.value; render()">
        <option value="all">All centres</option>${centreList.map((c) => `<option value="${esc(c)}" ${logDraft.centreFilter === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
      </select></div>
      <button class="btn btn-outline" style="height:40px;" onclick="exportLogCsv()">⬇ Export CSV</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Week</th><th>Rider</th><th>Item</th><th>Centre</th><th>Qty</th><th>Reason</th><th>Payment</th><th>Issued By</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
  `;
}
async function deleteIssuance(id) {
  try { await apiCall("deleteIssuance", { id }); await refreshData(); render(); } catch (e) { showToast(e.message, "error"); }
}
window.deleteIssuance = deleteIssuance;
function exportLogCsv() {
  const filtered = STATE.issuances.filter((i) =>
    (logDraft.weekFilter === "all" || i.week === logDraft.weekFilter) &&
    (logDraft.centreFilter === "all" || i.centre === logDraft.centreFilter)
  );
  const header = ["Date", "Weekday", "Week", "Rider ID", "Rider Name", "Item", "Size", "SKU", "Centre", "Qty", "Replacement Reason", "Competitor", "Amount (KES)", "Payment", "Transaction Code", "Issued By", "Issued By Email"];
  const rows = filtered.map((i) => [
    i.date, i.weekday, i.week, i.riderId, i.riderName, i.itemName, i.size || "", i.sku, i.centre, i.qty,
    i.replacementReason || "", i.competitorName || "", i.amount || 0,
    i.paymentMethod === "wallet" ? "Wallet (unpaid)" : i.paymentMethod === "paid" ? "Paid" : i.paymentMethod === "free" ? "Free" : "n/a",
    i.transactionCode || "", i.issuedByName || "", i.issuedByEmail || "",
  ]);
  const csv = [header, ...rows].map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `glovo_issuance_log_${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
}
window.exportLogCsv = exportLogCsv;

</script>
</body>
</html>
